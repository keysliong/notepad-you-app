[package]
name = "notepad-you"
version = "1.0.0"
edition = "2021"
description = "Notepad You — красивый блокнот в стиле Material You с поддержкой Markdown"

[workspace]
members = [".", "installer"]

[[bin]]
name = "NotepadYou"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui_commonmark = "0.18"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
swash = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
